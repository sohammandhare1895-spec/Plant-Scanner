<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Settings · CropDoc Pro</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/settings.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
    <div id="app">
        <nav class="main-nav">
            <div class="nav-brand">
                <i class="fas fa-seedling"></i>
                <span>CropDoc <span class="pro-badge">PRO</span></span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="scanner.html"><i class="fas fa-camera"></i> Scanner</a></li>
                <li><a href="gallery.html"><i class="fas fa-images"></i> Gallery</a></li>
                <li><a href="analytics.html"><i class="fas fa-chart-line"></i> Analytics</a></li>
                <li><a href="reports.html"><i class="fas fa-file-pdf"></i> Reports</a></li>
                <li><a href="settings.html" class="active"><i class="fas fa-cog"></i></a></li>
            </ul>
        </nav>

        <main class="settings-main">
            <h1><i class="fas fa-cog"></i> Settings</h1>

            <div class="settings-grid">
                <div class="settings-section">
                    <h3><i class="fas fa-camera"></i> Camera Settings</h3>
                    <div class="setting-item">
                        <label>Resolution</label>
                        <select id="cameraResolution">
                            <option value="640x480">640x480</option>
                            <option value="1280x720" selected>1280x720</option>
                            <option value="1920x1080">1920x1080</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Facing Mode</label>
                        <select id="facingMode">
                            <option value="environment" selected>Back Camera</option>
                            <option value="user">Front Camera</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Frame Rate</label>
                        <select id="frameRate">
                            <option value="15">15 fps</option>
                            <option value="30" selected>30 fps</option>
                            <option value="60">60 fps</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section">
                    <h3><i class="fas fa-brain"></i> AI & Detection</h3>
                    <div class="setting-item">
                        <label>Detection Interval</label>
                        <select id="detectionInterval">
                            <option value="1000">1 second</option>
                            <option value="2000" selected>2 seconds</option>
                            <option value="3000">3 seconds</option>
                            <option value="5000">5 seconds</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Confidence Threshold</label>
                        <input type="range" id="confidenceThreshold" min="50" max="90" value="70" />
                        <span id="thresholdValue">70%</span>
                    </div>
                    <div class="setting-item">
                        <label><input type="checkbox" checked /> Auto-save scans</label>
                    </div>
                </div>

                <div class="settings-section">
                    <h3><i class="fas fa-palette"></i> Appearance</h3>
                    <div class="setting-item">
                        <label>Theme</label>
                        <select id="themeSelect">
                            <option value="dark" selected>Dark</option>
                            <option value="light">Light</option>
                            <option value="green">Green</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Language</label>
                        <select id="languageSelect">
                            <option value="en">English</option>
                            <option value="es">Español</option>
                            <option value="fr">Français</option>
                            <option value="hi">हिन्दी</option>
                            <option value="zh">中文</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section">
                    <h3><i class="fas fa-database"></i> Data Management</h3>
                    <div class="setting-item">
                        <button id="exportDataBtn" class="btn-secondary"><i class="fas fa-download"></i> Export All Data</button>
                        <button id="importDataBtn" class="btn-secondary"><i class="fas fa-upload"></i> Import Data</button>
                    </div>
                    <div class="setting-item">
                        <button id="clearDataBtn" class="btn-danger"><i class="fas fa-trash"></i> Clear All Data</button>
                    </div>
                    <div class="setting-item">
                        <span>Storage Used: <span id="storageUsed">0 MB</span></span>
                    </div>
                </div>

                <div class="settings-section">
                    <h3><i class="fas fa-info-circle"></i> About</h3>
                    <div class="setting-item">
                        <p><strong>Version:</strong> 2.0.0</p>
                        <p><strong>Build:</strong> #2026.08.28</p>
                        <p><strong>AI Model:</strong> CropNet v3.2</p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="main-footer">
            <span>© 2026 CropDoc Pro · Advanced Agricultural AI</span>
            <span id="liveTime"></span>
        </footer>
    </div>

    <script src="../js/settings.js"></script>
</body>
</html>
